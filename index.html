<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="마스터 스튜디오">
  <title>파메스테틱 스튜디오</title>
  <style>
    body { margin:0; background:#070B14; color:#F8FAFC; font-family:-apple-system,BlinkMacSystemFont,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; text-align:center; }
    .spinner { width:38px; height:38px; border:3.5px solid rgba(56,189,248,0.2); border-top-color:#38BDF8; border-radius:50%; animation:spin 0.7s linear infinite; margin-bottom:14px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .title { font-size:17px; font-weight:800; color:#F8FAFC; margin-bottom:6px; }
    .sub { font-size:12px; color:#94A3B8; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="title">🚀 파메스테틱 스튜디오 접속 중...</div>
  <div class="sub">한국 CDN 영구 고정 주소에서 실시간 보안 터널로 연결합니다</div>
  <script>
    (async function() {
      try {
        const r = await fetch("https://api.telegram.org/bot8892474971:AAFhCabmuI3yP7iY7W4Vz0y-kqt90XgwE5s/getChatMenuButton?_t=" + Date.now(), { cache: "no-store" });
        const d = await r.json();
        const target = d && d.result && d.result.web_app && d.result.web_app.url;
        if (target) {
          let subPath = window.location.pathname
            .replace(/^\/portal(\/index\.html)?/, "")
            .replace(/^\/index\.html$/, "");
          if (!subPath.startsWith("/")) subPath = "/" + subPath;
          window.location.replace(target.replace(/\/$/, "") + subPath + window.location.search + window.location.hash);
          return;
        }
      } catch (e) {}
      window.location.replace("http://192.168.45.213:7777" + window.location.search);
    })();
  </script>
</body>
</html>
